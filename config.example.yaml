# Skopiuj do config.yaml i uzupełnij.

vinted:
  domain: vinted.pl          # vinted.de, vinted.fr ...
  poll_interval_sec: 20      # nie schodź poniżej ~15 s, bo grozi blokada IP
  per_page: 48
  seed_pages: 5              # tyle stron ofert pobiera na start jako bazę do porównań cen

discord:
  channel_id: 123456789012345678   # kanał, na który lecą oferty
  token_env: DISCORD_TOKEN         # nazwa zmiennej środowiskowej z tokenem

ai:
  enabled: true
  provider: anthropic        # anthropic = Claude przez API | ollama = lokalny model
  model: claude-opus-5-5     # tańsza opcja: claude-haiku-5-5 (~40x taniej)
  effort: low                # low wystarcza do klasyfikacji, high = dokładniej, drożej
  max_images: 4
  # Dla provider: ollama (najpierw: ollama pull qwen2.5vl:7b)
  ollama_url: http://localhost:11434
  ollama_model: qwen2.5vl:7b

messages:
  gender: m                  # m / f: "wziął" / "wzięła" w wiadomościach do sprzedawców

strategy:
  buy_below_ratio: 0.65      # kup, gdy cena <= 65% rynku
  offer_discount: 0.30       # inaczej zaproponuj -30%
  min_profit: 100            # minimalny zysk w zł
  resale_percentile: 0.35    # realna cena odsprzedaży = taniej niż 65% podobnych ofert
  resale_haircut: 0.05       # dodatkowy zapas na cenie odsprzedaży
  min_comparables: 5         # min. liczba podobnych ofert do wyceny
  comparable_days: 14        # z ilu dni brać aktywne oferty do porównań
  similarity_min: 0.35       # jak podobny musi być tytuł (0..1)
  shipping_cost: 15
  buyer_fee_fixed: 0.70      # ochrona kupujących Vinted
  buyer_fee_pct: 0.05
  too_good_ratio: 0.30       # poniżej 30% rynku = podejrzanie tanio
  min_price_samples: 5       # tyle sprzedaży potrzeba do mediany
  price_history_days: 30
  risk:
    medium: 30
    high: 60                 # od tylu punktów oferta idzie do Approve/Deny jako ryzykowna

watches:
  - name: iphone-13-pro
    search_text: "iphone 13 pro"
    kind: electronics        # clothes | shoes | electronics | other
    price_to: 2500
    reference_price: 2200    # opcjonalne: górny limit wyceny (bot bierze najniższą)
    min_profit: 200

  - name: stone-island
    search_text: "stone island"
    kind: clothes
    price_to: 400
    reference_price: 450
